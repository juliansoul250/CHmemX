name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.11'
          - os: macos-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: git config --global core.autocrlf false
      - run: python -m pip install '.[test]' ruff build
      - run: python -m ruff check --config pyproject.toml .
      - run: python -B -m unittest discover -s tests -p '*test*.py'
      - run: python -m chmemx.scripts.benchmark --output benchmark.json
      - run: python -m build
      - run: python tests/installed_package_smoke.py
