name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install '.[test]'
      - run: python3 tests/test_assemble_inventory.py
      - run: python3 tests/test_curate_uploads.py
      - run: python3 tests/test_vector_memory.py
      - run: PYTHONPATH=runtime python3 tests/simple_memory_test.py
      - run: python3 tests/test_docs.py
      - run: python -m unittest discover -s tests -p 'test_service.py'
      - run: python -m chmemx.scripts.benchmark --output /tmp/chmemx-benchmark.json
      - run: python -m pip wheel --no-deps --wheel-dir /tmp/wheels .
